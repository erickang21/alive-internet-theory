[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["."]
# Migration files are generated by Alembic autogenerate (see README).
exclude = ["**/__pycache__", ".venv", "data", "database/migrations/versions"]
# The code imports itself as the `backend` package, so resolve from the repo root.
extraPaths = [".."]
venvPath = "."
venv = ".venv"
reportUnusedCallResult = "error"
reportImplicitStringConcatenation = "error"
reportMissingSuperCall = "error"
reportUninitializedInstanceVariable = "error"
