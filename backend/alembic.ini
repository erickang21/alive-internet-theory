# Alembic migrations for the SQLite database. The API applies pending
# migrations on startup; to create one after changing
# backend/database/models.py:
#   alembic -c backend/alembic.ini revision --autogenerate -m "add foo column"
# The database URL comes from backend.config (SQLITE_PATH), see env.py.

[alembic]
script_location = %(here)s/database/migrations
# Makes the `backend` package importable wherever alembic is run from.
prepend_sys_path = %(here)s/..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
